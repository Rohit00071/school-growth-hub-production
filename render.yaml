services:
  # 1. API Gateway
  - type: web
    name: school-hub-gateway
    env: node
    rootDir: services/gateway
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: USER_SERVICE_URL
        fromService:
          type: web
          name: user-service
          property: host
      - key: OBSERVATION_SERVICE_URL
        fromService:
          type: web
          name: observation-service
          property: host
      - key: GOAL_SERVICE_URL
        fromService:
          type: web
          name: goal-service
          property: host
      - key: DOCUMENT_SERVICE_URL
        fromService:
          type: web
          name: document-service
          property: host
      - key: NOTIFICATION_SERVICE_URL
        fromService:
          type: web
          name: notification-service
          property: host
      - key: ANALYTICS_SERVICE_URL
        fromService:
          type: web
          name: analytics-service
          property: host
      - key: MONOLITH_SERVICE_URL
        fromService:
          type: web
          name: backend-monolith
          property: host

  # 2. User Service
  - type: web
    name: user-service
    env: node
    rootDir: services/user-service
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: cache-bus
          property: connectionString

  # 3. Observation Service
  - type: web
    name: observation-service
    env: node
    rootDir: services/observation-service
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: cache-bus
          property: connectionString

  # 4. Goal Service
  - type: web
    name: goal-service
    env: node
    rootDir: services/goal-service
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: cache-bus
          property: connectionString

  # 5. Document Service
  - type: web
    name: document-service
    env: node
    rootDir: services/document-service
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: cache-bus
          property: connectionString

  # 6. Notification Service
  - type: web
    name: notification-service
    env: node
    rootDir: services/notification-service
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: cache-bus
          property: connectionString

  # 7. Analytics Service
  - type: web
    name: analytics-service
    env: node
    rootDir: services/analytics-service
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: cache-bus
          property: connectionString

  # 8. Backend Monolith (Legacy)
  - type: web
    name: backend-monolith
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: cache-bus
          property: connectionString

  # 9. Redis (Event Bus)
  - type: redis
    name: cache-bus
    ipAllowList: []

  # 10. Frontend (Static Site)
  - type: web
    name: school-hub-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false # Set this to your Gateway URL + /api/v1 after deployment
